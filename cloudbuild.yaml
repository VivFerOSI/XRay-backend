substitutions:
  _REGION: southamerica-east1
  _SERVICE: xray-backend
  _REPOSITORY: xray-backend
  # Instancia de Cloud SQL: <PROJECT_ID>:<REGION>:<INSTANCE>
  _SQL_INSTANCE: big-cargo-469201-r1:southamerica-east1:xray-db
  _DB_USER: xray_app
  _DB_NAME: xray
  # Dominios del frontend (Firebase Hosting) permitidos por CORS. Separados por coma.
  _FRONTEND_ORIGIN: "https://big-cargo-469201-r1.web.app,https://big-cargo-469201-r1.firebaseapp.com"
  _MAIL_FROM: no-reply@x-ray.com.ar
  _MAIL_FROM_NAME: "X-Ray Autoevaluacion"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"
      - --region
      - "${_REGION}"
      - --platform
      - managed
      - --allow-unauthenticated
      # Socket de Cloud SQL montado en /cloudsql/<INSTANCE_CONNECTION_NAME>
      - --add-cloudsql-instances
      - "${_SQL_INSTANCE}"
      # Variables de entorno no sensibles
      - --set-env-vars
      - "DB_HOST=/cloudsql/${_SQL_INSTANCE},DB_PORT=5432,DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},DB_SYNCHRONIZE=false,FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},MAIL_FROM=${_MAIL_FROM},MAIL_FROM_NAME=${_MAIL_FROM_NAME}"
      # Secretos gestionados en Secret Manager (crear con: gcloud secrets create ...)
      # SendGrid queda fuera hasta tener la API key real: sin SENDGRID_API_KEY el
      # EmailService se desactiva solo (ver email.service.ts). Cuando exista la key:
      # crear el secreto `sendgrid-api-key` y agregar ",SENDGRID_API_KEY=sendgrid-api-key:latest".
      - --set-secrets
      - "DB_PASSWORD=db-password:latest"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
